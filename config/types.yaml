# 类型定义配置
# 单一真实来源 (SSOT) - 所有类型枚举在此文件中定义

version: "1.0"

# 任务类型定义（用于 LLM 配置和系统提示词）
task_types:
  filter:
    code: "filter"
    label: "文章过滤"
    label_en: "Filter"
    description: "判断文章与主题的相关性"
    priority: 1
    enabled: true

  summary:
    code: "summary"
    label: "文章摘要"
    label_en: "Summary"
    description: "生成文章内容摘要"
    priority: 2
    enabled: true

  keywords:
    code: "keywords"
    label: "关键词提取"
    label_en: "Keywords"
    description: "从文章中提取关键词"
    priority: 3
    enabled: true

  translation:
    code: "translation"
    label: "中英翻译"
    label_en: "Translation"
    description: "翻译文章内容"
    priority: 4
    enabled: true

  daily_summary:
    code: "daily_summary"
    label: "当日总结"
    label_en: "Daily Summary"
    description: "汇总当日所有通过的文章"
    priority: 5
    enabled: true

  daily_summary_journal:
    code: "daily_summary_journal"
    label: "期刊类每日总结"
    label_en: "Daily Journal Summary"
    description: "每日期刊类总结（全部期刊 / 通过期刊）"
    priority: 9
    enabled: true

  daily_summary_blog_news:
    code: "daily_summary_blog_news"
    label: "资讯类每日总结"
    label_en: "Daily Blog & News Summary"
    description: "每日博客与资讯类总结"
    priority: 10
    enabled: true

  analysis:
    code: "analysis"
    label: "文章分析"
    label_en: "Analysis"
    description: "深度分析文章内容（预留）"
    priority: 6
    enabled: false

  insights:
    code: "insights"
    label: "洞察总结"
    label_en: "Insights"
    description: "每15天汇总通过的文章，生成研究趋势洞察报告"
    priority: 7
    enabled: true

  email_parse:
    code: "email_parse"
    label: "邮件文章解析"
    label_en: "Email Parse"
    description: "从邮件内容中提取多篇文章的结构化信息"
    priority: 8
    enabled: true
  cluster_facet:
    code: "cluster_facet"
    label: "主题聚类-切面抽取"
    label_en: "Cluster Facet Extraction"
    description: "从全文总结中抽取研究问题/方法/对象/发现等切面（主题聚类模块）"
    priority: 11
    enabled: true

  cluster_analysis:
    code: "cluster_analysis"
    label: "主题聚类-多维分析"
    label_en: "Cluster Multi-Dimension Analysis"
    description: "对单个主题生成研究脉络/趋势/空白等多维分析（主题聚类模块）"
    priority: 12
    enabled: true

  cluster_naming:
    code: "cluster_naming"
    label: "主题聚类-主题命名"
    label_en: "Cluster Topic Naming"
    description: "为新增主题生成名称与关键词（主题聚类模块）"
    priority: 13
    enabled: true

source_types:
  journal:
    code: "journal"
    label: "期刊"
    label_en: "Journal"
    description: "学术期刊 RSS 源"
    priority: 1
    icon: "journal"

  blog:
    code: "blog"
    label: "博客"
    label_en: "Blog"
    description: "个人或团队博客"
    priority: 2
    icon: "blog"
    default: true

  news:
    code: "news"
    label: "资讯"
    label_en: "News"
    description: "新闻资讯网站"
    priority: 3
    icon: "news"

  email:
    code: "email"
    label: "邮件订阅"
    label_en: "Email"
    description: "Gmail 邮件订阅源"
    priority: 4
    icon: "email"

metadata:
  created_at: "2025-01-10"
  updated_at: "2025-01-10"
  schema_version: "1.0"
